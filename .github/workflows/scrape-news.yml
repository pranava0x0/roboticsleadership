name: Scrape news (daily)

on:
  schedule:
    # 11:00 UTC = ~07:00 ET. Cron is UTC; no DST awareness.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-mutation
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run news scraper
        run: node scripts/scraper-news.js

      - name: Validate JSON after scrape
        run: node scripts/validate.js

      - name: Commit changes if any
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json docs/data/sources.json
          if git diff --staged --quiet; then
            echo "No new news items — nothing to commit."
            exit 0
          fi
          git commit -m "data(news): auto-scrape $(date -u +%Y-%m-%d)"
          git push
