name: Scrape news (daily)

on:
  schedule:
    # 11:00 UTC = ~07:00 ET. Cron is UTC; no DST awareness.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape-news
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # Chain onto an already-open auto/news-* PR instead of always branching off
      # main. Without this, curation lagging a few days (it runs roughly every
      # 4-7 days, not daily — see backlog.md) means every run opens ANOTHER
      # independent PR, each re-discovering an increasingly overlapping backlog:
      # 29 piled up 2026-08-13→09-07 at the worst point. Chaining means there's
      # ever only one open auto/news-* PR to curate, and the lookback window
      # widens to cover however long it's been waiting, so a slow curation pass
      # loses nothing (the scraper's normal --days=3 default would otherwise miss
      # anything older than 3 days once it resumes).
      - name: Find a pending curator-review PR and size the scrape window
        id: pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PR_JSON=$(gh pr list --state open --base main --limit 100 \
            --json number,headRefName,headRepositoryOwner,isCrossRepository,createdAt \
            --jq '[.[] | select(
              (.isCrossRepository | not) and
              .headRepositoryOwner.login == env.GITHUB_REPOSITORY_OWNER and
              (.headRefName | startswith("auto/news-"))
            )] | sort_by(.createdAt) | .[0] // empty')
          if [ -n "$PR_JSON" ]; then
            BRANCH=$(echo "$PR_JSON" | jq -r '.headRefName')
            NUMBER=$(echo "$PR_JSON" | jq -r '.number')
            CREATED=$(echo "$PR_JSON" | jq -r '.createdAt')
            DAYS=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 86400 + 1 ))
            [ "$DAYS" -lt 3 ] && DAYS=3
            [ "$DAYS" -gt 45 ] && DAYS=45
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "days=$DAYS" >> "$GITHUB_OUTPUT"
            echo "new_branch=false" >> "$GITHUB_OUTPUT"
            echo "Appending to already-open PR #$NUMBER ($BRANCH, opened $CREATED) — using a ${DAYS}-day lookback so nothing published while it waited falls through the cracks."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
          else
            echo "branch=auto/news-$(date -u +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"
            echo "days=3" >> "$GITHUB_OUTPUT"
            echo "new_branch=true" >> "$GITHUB_OUTPUT"
            echo "No pending auto/news-* PR — starting a fresh 3-day scrape."
          fi

      - name: Run news scraper
        run: node scripts/scraper-news.js --days=${{ steps.pending.outputs.days }}

      # Freshly scraped records carry _requires_curator_review by design, which
      # the deploy-time gate rejects. Check their shape here; pages.yml enforces
      # the gate at publish, so nothing uncurated can reach the site.
      - name: Validate JSON after scrape
        run: node scripts/validate.js --allow-uncurated

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git diff --quiet docs/data/news.json docs/data/sources.json; then
            echo "No new news items — nothing to add."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ steps.pending.outputs.branch }}"
          if [ "${{ steps.pending.outputs.new_branch }}" = "true" ]; then
            git checkout -b "$BRANCH"
          fi
          git add docs/data/news.json docs/data/sources.json
          git commit -m "data(news): auto-scrape $(date -u +%Y-%m-%d)"
          git push --set-upstream origin "$BRANCH"
          if [ "${{ steps.pending.outputs.new_branch }}" = "true" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "data(news): auto-scrape $(date -u +%Y-%m-%d)" \
              --body-file .github/pr-body-news.md
          else
            gh pr comment "${{ steps.pending.outputs.pr_number }}" \
              --body "Appended $(date -u +%Y-%m-%d)'s scrape to this still-open PR rather than opening a new one — see this branch's commit log for what's new. Still pending curator review before merge."
          fi
