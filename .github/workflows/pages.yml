name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; cancel in-progress runs on a new commit to the same branch.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Lint GitHub Actions (reject floating tags)
        run: node scripts/lint-actions.js

      - name: Validate JSON before publishing
        run: node scripts/validate.js

      # "Bake, not build": inject rendered HTML into the marked slots so the
      # deployed pages carry their content for crawlers and no-JS readers. The
      # repo stays no-build for local dev; this only ever runs against this
      # throwaway checkout, never against anything that gets committed.
      # Ephemeral by design — see the WS1 note in improvement-plan-2.md: this
      # step is only safe for output that is a pure function of committed data.
      - name: Bake static HTML into the shipped pages
        run: node scripts/render-static.js --write

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
