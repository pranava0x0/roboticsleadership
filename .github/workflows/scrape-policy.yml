name: Scrape policy (weekly)

on:
  schedule:
    # Monday 14:00 UTC = ~10:00 ET.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scrape-policy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run policy scraper
        run: node scripts/scraper-policy.js

      # Freshly scraped records carry _requires_curator_review by design, which
      # the deploy-time gate rejects. Check their shape here; pages.yml enforces
      # the gate at publish, so nothing uncurated can reach the site.
      - name: Validate JSON after scrape
        run: node scripts/validate.js --allow-uncurated

      - name: Open PR for curator review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git diff --quiet docs/data/policies.json docs/data/sources.json; then
            echo "No new policy items — nothing to PR."
            exit 0
          fi
          STAMP="$(date -u +%Y-%m-%d-%H%M%S)"
          BRANCH="auto/policy-$STAMP"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/data/policies.json docs/data/sources.json
          git commit -m "data(policy): auto-scrape $(date -u +%Y-%m-%d)"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "data(policy): auto-scrape $(date -u +%Y-%m-%d)" \
            --body-file .github/pr-body-policy.md
